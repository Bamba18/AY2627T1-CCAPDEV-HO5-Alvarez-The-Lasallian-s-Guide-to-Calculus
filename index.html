<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Calculus Guide Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <div id="div-title" class="text-center">
            <h1>The Lasallian's Guide to Calculus</h1>
            <p class="subtitle">by Ivan Alvarez of N01 Group 4</p>
        </div>

        <hr>

        <div id="div-charts" class="row">

            <!-- chart 1 -->
            <div class="col-12 col-lg-4">
                <div class="chart-box">
                    <h2>Exercise Grades</h2>
                    <canvas id="barChart"></canvas>
                </div>
            </div>

            <!-- chart 2 -->
            <div class="col-12 col-lg-4">
                <div class="chart-box">
                    <h2>Time Students Answered</h2>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>

            <!-- chart 3 -->
            <div class="col-12 col-lg-4">
                <div class="chart-box">
                    <h2>Types of Users</h2>
                    <canvas id="pieChart"></canvas>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
